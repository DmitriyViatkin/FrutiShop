{% load static %}

<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyFruitShop</title>
  <link rel="stylesheet" href="{% static 'css/trading.css' %}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.10/htmx.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>

<!-- HEADER -->
{% include 'includes/header.html' %}

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- STOCK TABLE -->

<!- table_fruit.html ->

<div class="panel stock-panel">
    <div class="panel-title">Товары на складе</div>
    <div id="stock-table"
     hx-get="/trading/stocks/"
     hx-trigger="every 5s"
     hx-swap="innerHTML"
     hx-sync="this:replace"
     hx-disinherit="*">


      {% include 'includes/table_fruit.html' %}
    </div>

    <!-- Celery task controls (Раздел 1) -->
    <div class="task-controls">
      <button class="task-btn" id="btn-start-supply"
              hx-post="{% url 'toggle_tasks' 'start' %}"
              hx-target="#log-list"
              hx-swap="afterbegin">▶ Запустить поставки</button>
      <button class="task-btn" id="btn-stop-supply"
              hx-post="{% url 'toggle_tasks' 'stop' %}"
              hx-target="#log-list"
              hx-swap="afterbegin">■ Стоп поставки</button>
      <button class="task-btn" id="btn-audit"
              hx-post="{% url 'run_inventory_audit' %}"
              hx-target="#audit-result">🔍 Проверка склада</button>
      <span id="audit-result" style="font-size:11px; font-family: var(--mono); color: var(--muted);"></span>
    </div>

    <!-- Audit progress bar (Раздел 7) -->

  </div>
  <!-- LOG PANEL (WebSocket target) -->
  <div class="panel log-panel">
    <div class="panel-title">Лог операций</div>
    <div class="log-list" id="log-list">
      <!-- populated via WebSocket / HTMX -->

    </div>
  </div>

  <!-- BOTTOM LEFT: CHAT + BANK -->
  <div class="bottom-left">

    <!-- CHAT (Раздел 4) -->
    <div class="panel chat-panel">
      <div class="panel-title">Чат</div>
      <div class="chat-messages" id="chat-messages"
            >

      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Текст сообщения"
               name="message">

        <button class="btn btn-orange"
                onclick="sendChat()">Отправить</button>
      </div>
    </div>

    <!-- BANK (Раздел 3) -->
    <div class="panel bank-panel">
      <div class="panel-title">Банк</div>
      <div class="bank-body">
        <div class="bank-label">Банковский счёт:</div>
        <div class="bank-balance" id="bank-balance">{{ account.balance }}USD</div>

        <div>
          <div class="progress-wrap">
            <div class="progress-bar" id="bank-progress" style="width:0%"></div>
            <div class="progress-label" id="bank-progress-label">0%</div>
          </div>
        </div>

        <button class="btn btn-blue" style="width:100%"
                hx-post="{% url 'run_bank_audit' %}"
                hx-target="#audit-result">
          Провести бухгалтерский аудит
        </button>

        <div class="bank-row">
          <input type="number" id="amount-input" placeholder="сумма" name="amount"
       min="0.01" step="0.01" required>
          <button class="btn btn-green"
                  onclick="return validateAmount()"
                  hx-post="{% url 'deposit' %}"
                  hx-include="#amount-input"
                  hx-target="#bank-balance"
                  hx-swap="innerHTML">Пополнить</button>
          <button class="btn btn-sell"
                  onclick="return validateAmount()"
                  hx-post="{% url 'withdraw' %}"
                  hx-include="#amount-input"
                  hx-target="#bank-balance"
                  hx-swap="innerHTML">Вывести</button>
        </div>

        <!-- Declarations (Раздел 6) -->
        <div class="declarations-row">
          <form id="decl-form"
                hx-post="{% url 'upload_declaration' %}"
                hx-encoding="multipart/form-data"
                hx-target="#declarations-count"
                hx-swap="innerHTML">

              {% csrf_token %}

              <input type="file"
                 id="file-input"
                     name="declaration"
                 accept=".xlsx,.xls,.csv"
                 onchange="this.form.requestSubmit()">
          </form>
<span>Загружено: <b id="declarations-count">0</b> шт.</span>
        </div>


          <!-- populated by periodic AJAX -->
        </div>
      </div>
    </div>

  </div><!-- /bottom-left -->

</div><!-- /layout -->


<script>window.CSRF_TOKEN = '{{ csrf_token }}';</script>
<script src="{% static 'js/trading_ws.js' %}"></script>
</body>
</html>
